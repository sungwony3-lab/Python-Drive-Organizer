openapi: 3.1.0
info:
  title: Python Drive Organizer API
  version: 1.7-MVP01.1
  description: >-
    Read-only operations access a SQLite index of Google Drive file and folder
    metadata, including paged Tree viewing and authenticated TXT/DOCX/XLSX
    export. Contacts operations access the SQLite address-book snapshot. Plain
    email has a read-only preview and confirmed
    text-only send with no Drive calls. The legacy confirmed operation sends
    one exact Drive blob as an attachment. Enhanced email uses a read-only
    preview followed by a confirmed send of 1-5 attachments or Drive links.
    Link send may create only non-discoverable anyone/reader permissions after
    warning that a forwarded link remains accessible. No operation creates,
    updates, moves, copies, trashes, or deletes Drive items.
servers:
  - url: https://drive-api.sungwony.pe.kr
    description: Cloudflare HTTPS endpoint for Python Drive Organizer
security:
  - BearerAuth: []
paths:
  /status:
    get:
      operationId: getDriveStatus
      summary: Get the current Drive index status
      description: >-
        Use this to check counts and the latest completed or attempted SQLite
        metadata-index scan. It reports index state, not live Google Drive state.
      responses:
        "200":
          description: Current SQLite index counts and latest scan status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /files/search:
    get:
      operationId: searchFiles
      summary: Search indexed files by name
      description: >-
        Search the SQLite Google Drive metadata index for files whose name,
        normalized name, or base name contains the query. This does not search
        file contents or query Google Drive live.
      parameters:
        - name: q
          in: query
          required: true
          description: Non-empty case-insensitive filename substring to search.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of result items to return, from 1 through 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Matching indexed file metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileSearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /folders/search:
    get:
      operationId: searchFolders
      summary: Search indexed folders by name
      description: >-
        Search indexed Google Drive folder metadata by a case-insensitive name
        substring. Use a returned folder_id for children or subtree requests.
      parameters:
        - name: q
          in: query
          required: true
          description: Non-empty case-insensitive folder-name substring to search.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of result items to return, from 1 through 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Matching indexed folder metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderSearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /folders/{folder_id}/children:
    get:
      operationId: listFolderChildren
      summary: List children of an indexed folder
      description: >-
        List direct children or all indexed descendants of a folder. The
        folder_id must come from the user or a previous API result. This reads
        the SQLite index only.
      parameters:
        - name: folder_id
          in: path
          required: true
          description: Exact indexed folder ID.
          schema:
            type: string
        - name: recursive
          in: query
          required: false
          description: Include all descendants when true; otherwise list direct children.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: Maximum number of result items to return, from 1 through 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Direct children or recursively collected descendants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderChildrenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /folders/tree:
    get:
      operationId: getFolderTree
      summary: Render the indexed folder tree
      description: >-
        Render a deterministic text tree from SQLite folder metadata. Optionally
        start at an exact folder_id, restrict depth, or include indexed file
        names. The result is not a live Google Drive traversal.
      parameters:
        - name: root_folder
          in: query
          required: false
          description: Optional exact folder_id to use as the tree root.
          schema:
            type: string
        - name: max_depth
          in: query
          required: false
          description: Optional maximum depth from the selected root; zero returns the root level.
          schema:
            type: integer
            minimum: 0
        - name: include_files
          in: query
          required: false
          description: Include indexed file names in the text tree when true.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Rendered folder tree and included item counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /folders/tree/page:
    post:
      operationId: getDriveTreePage
      summary: Page through the complete indexed Drive tree
      description: >-
        Return deterministic SQLite tree nodes. Continue with the exact opaque
        next_cursor until it is null. No Google Drive call is made.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreePageRequest"
      responses:
        "200":
          description: One stable page of indexed Drive tree nodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreePageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The SQLite snapshot changed; restart from the first page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /exports/drive-tree:
    post:
      operationId: exportDriveTree
      summary: Export the complete indexed Drive tree
      description: >-
        Generate one TXT, DOCX, or XLSX from the complete SQLite tree. The
        server builds the document without GPT assembling paged nodes.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreeExportRequest"
      responses:
        "200":
          description: Export metadata and opaque ID for authenticated download.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeExportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServiceUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /exports/{export_id}/openai-file:
    post:
      operationId: returnDriveTreeExport
      summary: Return a Drive tree export to the GPT conversation
      description: >-
        Return the generated file as openaiFileResponse using the exact
        export_id from exportDriveTree. Never invent or alter the ID.
      x-openai-isConsequential: false
      parameters:
        - name: export_id
          in: path
          required: true
          description: Exact opaque export ID returned by exportDriveTree.
          schema:
            type: string
            minLength: 32
            maxLength: 32
      responses:
        "200":
          description: GPT Actions conversation-file response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIFileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: The generated file exceeds the 10 MB GPT file limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /revisions:
    get:
      operationId: listRevisions
      summary: List parser-classified Revision files
      description: >-
        Return Revision metadata already classified by the Python filename
        parser and stored in SQLite. Use min_revision only when the user requests
        a minimum parsed revision number.
      parameters:
        - name: min_revision
          in: query
          required: false
          description: Optional minimum parsed Revision number, inclusive.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of result items to return, from 1 through 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Indexed files classified as Revisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /copies:
    get:
      operationId: listCopies
      summary: List parser-classified Copy files
      description: >-
        Return Copy metadata already classified by the Python filename parser
        and stored in SQLite. No Drive copy operation is performed.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of result items to return, from 1 through 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Indexed files classified as Copies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auto-delete:
    get:
      operationId: listAutoDeleteFiles
      summary: List files carrying the DELETE classification
      description: >-
        Return files whose stored parser classification is auto_action=DELETE.
        This is classification metadata only; no file is trashed or deleted and
        drive_action_executed is always false.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of result items to return, from 1 through 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Stored DELETE classifications with explicit safety flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoDeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /groups:
    get:
      operationId: listFileGroups
      summary: List deterministic indexed file groups
      description: >-
        Return file groups and member metadata already produced by the Python
        grouping logic and stored in SQLite. This does not infer new groups or
        change Drive files.
      parameters:
        - name: min_members
          in: query
          required: false
          description: Minimum stored member_count for each returned group.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Maximum number of result items to return, from 1 through 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Stored file groups and their members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /recent:
    get:
      operationId: listRecentFiles
      summary: List recently modified indexed files
      description: >-
        Return current indexed file metadata sorted by stored modified_time
        descending. This reflects the latest SQLite scan, not a live Drive query.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of result items to return, from 1 through 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
      responses:
        "200":
          description: Most recently modified indexed files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /contacts/search:
    post:
      operationId: searchContacts
      summary: Search the SQLite contact directory
      description: >-
        Search current SQLite contacts by free text or exact organization,
        name, title, or email filters. Use this for name-based recipients.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactSearchRequest"
      responses:
        "200":
          description: Ranked matching contacts from the SQLite snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSearchResponse"
        "400":
          description: At least one non-empty search criterion is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /contacts/status:
    get:
      operationId: getContactsStatus
      summary: Get Contacts synchronization status
      description: >-
        Return the latest Contacts sync status, last successful completion
        time, and row statistics from SQLite. This does not refresh Contacts.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Latest Contacts synchronization state and statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactsStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /contacts/{contact_id}:
    get:
      operationId: getContact
      summary: Get one contact by exact ID
      description: >-
        Re-read one exact contact_id immediately before email preview. Never
        substitute a name match or an invented ID when this lookup fails.
      x-openai-isConsequential: false
      parameters:
        - name: contact_id
          in: path
          required: true
          description: Exact opaque contact_id returned by searchContacts.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Exact current contact from the SQLite snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The exact contact_id no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /email/send-file:
    post:
      operationId: sendEmailWithAttachment
      summary: Send one Drive file as a Gmail attachment
      description: >-
        Requires an exact Drive file_id obtained from the user or a previous
        read-only search Action. Call only after the user explicitly confirms
        the recipient, subject, plain-text body, and attachment. Sends one
        attachment to one recipient and causes an actual external email send.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSendRequest"
      responses:
        "200":
          description: >-
            Gmail accepted the message, or the same successful idempotency key
            was replayed without another Gmail send.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSendResponse"
        "400":
          description: Confirmation, recipient, attachment type, or size is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The exact file_id is absent from SQLite or Google Drive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "409":
          description: >-
            Idempotency conflict, prior pending state, or uncertain Gmail
            delivery. Do not retry automatically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: Drive download or Gmail send failed upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "503":
          description: OAuth, Gmail API, or SQLite index is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
  /email/send-text/preview:
    post:
      operationId: previewTextEmail
      summary: Preview a plain-text email without sending
      description: >-
        Validate one To, up to five CC addresses, a one-line subject, and a
        plain-text body. Returns a short-lived preview without Gmail, Drive,
        permission, attachment, or Google Sheets calls.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextEmailPreviewRequest"
      responses:
        "200":
          description: Short-lived plain-text email preview requiring approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextEmailPreviewResponse"
        "400":
          description: Recipient, CC, subject, or body is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: Persistent preview state is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
  /email/send-text:
    post:
      operationId: sendTextEmail
      summary: Send one confirmed plain-text email
      description: >-
        After explicit approval, send the unchanged payload using exactly the
        preview_id returned by the immediately preceding successful
        previewTextEmail call. Never invent or substitute it. No files, Drive
        links, or Drive writes. Never retry automatically.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextEmailSendRequest"
      responses:
        "200":
          description: Gmail accepted the message or returned an idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextEmailSendResponse"
        "400":
          description: Confirmation, recipient, CC, subject, body, or key is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The exact preview_id does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "409":
          description: >-
            Preview expired or changed, idempotency conflict, pending state, or
            uncertain delivery. Do not retry automatically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: Gmail rejected the send request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "503":
          description: Gmail OAuth, Gmail API, or persistent state is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
  /email/send-files/preview:
    post:
      operationId: previewEmailWithFiles
      summary: Preview an enhanced email without sending or sharing
      description: >-
        Preview 1-5 indexed files for one To and up to five CC addresses.
        Resolve attachment, link, or auto mode and return ordered files plus
        file-level anyone/reader sharing changes. Read-only: no download,
        permission creation, or Gmail send.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnhancedEmailPreviewRequest"
      responses:
        "200":
          description: Short-lived read-only enhanced email preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnhancedEmailPreviewResponse"
        "400":
          description: Recipient, CC, file list, mode, attachment, or link plan is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: An exact file ID is absent from SQLite or Google Drive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: Drive metadata or permission listing failed upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "503":
          description: Drive OAuth or the SQLite index is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
  /email/send-files:
    post:
      operationId: sendEmailWithFiles
      summary: Send one confirmed enhanced email
      description: >-
        After explicit approval, send using exactly the preview_id from the
        immediately preceding successful previewEmailWithFiles call for the
        same payload; never invent or substitute it. Sends 1-5 attachments or
        Drive links. Consequential; never retry automatically.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnhancedEmailSendRequest"
      responses:
        "200":
          description: Gmail accepted the message, or a completed idempotent result was replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnhancedEmailSendResponse"
        "400":
          description: Confirmation, payload, mode, attachment, or link plan is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: A preview or exact file ID is absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "409":
          description: >-
            Preview expired or changed, idempotency conflict, permission partial
            failure, pending state, or uncertain delivery. Do not retry automatically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: Drive download, permission creation, or Gmail send failed upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
        "503":
          description: Drive/Gmail OAuth, Gmail API, or SQLite state is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailErrorResponse"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: API key configured separately in the GPT Action authentication settings.
  responses:
    Unauthorized:
      description: Bearer authentication is missing or invalid.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested indexed folder was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: A query or path parameter failed validation.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/HTTPValidationError"
    ServiceUnavailable:
      description: Authentication configuration or the SQLite index is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    StatusResponse:
