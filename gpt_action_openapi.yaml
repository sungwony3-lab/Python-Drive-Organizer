          type: string
    TreeNodeItem:
      type: object
      additionalProperties: false
      required:
        - node_type
        - name
        - level
        - path
        - parent_id
        - id
        - mime_type
        - modified_time
        - extension
      properties:
        node_type:
          type: string
          enum: [FOLDER, FILE]
        name:
          type: string
        level:
          type: integer
          minimum: 0
        path:
          type: string
        parent_id:
          type:
            - string
            - "null"
        id:
          type: string
        mime_type:
          type:
            - string
            - "null"
        modified_time:
          type:
            - string
            - "null"
        extension:
          type:
            - string
            - "null"
    TreePageRequest:
      type: object
      additionalProperties: false
      properties:
        root_folder:
          type:
            - string
            - "null"
          description: Exact folder_id for a subtree, or null for the full Drive.
        include_files:
          type: boolean
          default: false
        max_depth:
          type:
            - integer
            - "null"
          minimum: 0
        page_size:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
        cursor:
          type:
            - string
            - "null"
          description: Exact next_cursor from the preceding page, or null initially.
    TreePageResponse:
      type: object
      additionalProperties: false
      required:
        - total_nodes
        - showing
        - next_cursor
        - has_more
        - items
        - latest_scan_id
        - latest_scan_status
        - scan_finished_at
      properties:
        total_nodes:
          type: integer
          minimum: 0
        showing:
          type: integer
          minimum: 0
        next_cursor:
          type:
            - string
            - "null"
        has_more:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/TreeNodeItem"
        latest_scan_id:
          type:
            - string
            - "null"
        latest_scan_status:
          type:
            - string
            - "null"
        scan_finished_at:
          type:
            - string
            - "null"
    TreeExportRequest:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format:
          type: string
          enum: [txt, docx, xlsx]
        root_folder:
          type:
            - string
            - "null"
          description: Exact folder_id for a subtree, or null for the full Drive.
        include_files:
          type: boolean
          default: true
        max_depth:
          type:
            - integer
            - "null"
          minimum: 0
    TreeExportResponse:
      type: object
      additionalProperties: false
      required:
        - export_id
        - format
        - filename
        - node_count
        - folder_count
        - file_count
        - latest_scan_id
        - latest_scan_status
        - scan_finished_at
        - created_at
        - download_endpoint
      properties:
        export_id:
          type: string
        format:
          type: string
          enum: [txt, docx, xlsx]
        filename:
          type: string
        node_count:
          type: integer
          minimum: 0
        folder_count:
          type: integer
          minimum: 0
        file_count:
          type: integer
          minimum: 0
        latest_scan_id:
          type:
            - string
            - "null"
        latest_scan_status:
          type:
            - string
            - "null"
        scan_finished_at:
          type:
            - string
            - "null"
        created_at:
          type: string
        download_endpoint:
          type: string
          description: Raw API-client path. GPT must call returnDriveTreeExport instead.
    OpenAIFileItem:
      type: object
      additionalProperties: false
      required: [name, mime_type, content]
      properties:
        name:
          type: string
          description: Actual generated filename shown to the GPT user.
        mime_type:
          type: string
          description: MIME type matching the TXT, DOCX, or XLSX export.
        content:
          type: string
          format: byte
          description: Base64-encoded bytes of the generated export.
    OpenAIFileResponse:
      type: object
      additionalProperties: false
      required: [openaiFileResponse]
      properties:
        openaiFileResponse:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/OpenAIFileItem"
    RevisionItem:
      type: object
      required: [file_id, name, path, revision_number, group_id, latest_revision_number]
      properties:
        file_id:
          type: string
        name:
          type: string
        path:
          type: string
        revision_number:
          type:
            - integer
            - "null"
        group_id:
          type:
            - string
            - "null"
        latest_revision_number:
          type:
            - integer
            - "null"
    RevisionResponse:
      type: object
      required: [min_revision, total, showing, items]
      properties:
        min_revision:
          type:
            - integer
            - "null"
        total:
          type: integer
        showing:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/RevisionItem"
    CopyItem:
      type: object
      required: [file_id, name, path, copy_type, copy_number, auto_action, group_id]
      properties:
        file_id:
          type: string
        name:
          type: string
        path:
          type: string
        copy_type:
          type: string
        copy_number:
          type:
            - integer
            - "null"
        auto_action:
          type: string
        group_id:
          type:
            - string
            - "null"
    CopyResponse:
      type: object
      required: [total, showing, items]
      properties:
        total:
          type: integer
        showing:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/CopyItem"
    AutoDeleteResponse:
      allOf:
        - $ref: "#/components/schemas/CopyResponse"
        - type: object
          required: [classification_only, drive_action_executed]
          properties:
            classification_only:
              type: boolean
              const: true
            drive_action_executed:
              type: boolean
              const: false
    GroupMember:
      type: object
      required: [group_id, file_id, name, member_type, revision_number, copy_number, auto_action]
      properties:
        group_id:
          type: string
        file_id:
          type: string
        name:
          type: string
        member_type:
          type: string
        revision_number:
          type:
            - integer
            - "null"
        copy_number:
          type:
            - integer
            - "null"
        auto_action:
          type: string
    GroupItem:
      type: object
      required:
        - group_id
        - parent_id
        - folder_path
        - group_base_name
        - extension
        - member_count
        - revision_count
        - copy_count
        - auto_delete_count
        - latest_revision_number
        - members
      properties:
        group_id:
          type: string
        parent_id:
          type:
            - string
            - "null"
        folder_path:
          type: string
        group_base_name:
          type: string
        extension:
          type:
            - string
            - "null"
        member_count:
          type: integer
        revision_count:
          type: integer
        copy_count:
          type: integer
        auto_delete_count:
          type: integer
        latest_revision_number:
          type:
            - integer
            - "null"
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
    GroupResponse:
      type: object
      required: [min_members, total, showing, items]
      properties:
        min_members:
          type: integer
        total:
          type: integer
        showing:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupItem"
    RecentItem:
      type: object
      required: [file_id, name, path, modified_time]
      properties:
        file_id:
          type: string
        name:
          type: string
        path:
          type: string
        modified_time:
          type:
            - string
            - "null"
    RecentResponse:
      type: object
      required: [total, showing, items]
      properties:
        total:
          type: integer
        showing:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecentItem"
    ContactSearchRequest:
      type: object
      additionalProperties: false
      description: >-
        Supply q or at least one exact filter. q and filters are combined with
        AND. Blank criteria are rejected by the API.
      properties:
        q:
          type:
            - string
            - "null"
          minLength: 1
          description: Text matched against normalized name, organization, title, and email.
        organization:
          type:
            - string
            - "null"
          minLength: 1
          description: Optional normalized exact organization filter.
        name:
          type:
            - string
            - "null"
          minLength: 1
          description: Optional normalized exact name filter.
        title:
          type:
            - string
            - "null"
          minLength: 1
          description: Optional normalized exact title filter.
        email:
          type:
            - string
            - "null"
          minLength: 1
          description: Optional case-insensitive exact email filter.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Maximum number of contacts to return.
    ContactItem:
      type: object
      additionalProperties: false
      required:
        - contact_id
        - organization
        - name
        - title
        - email
        - phone
        - email_usable
        - conflict_code
      properties:
        contact_id:
          type: string
          description: Exact opaque ID to preserve and re-read before preview.
        organization:
          type:
            - string
            - "null"
        name:
          type: string
        title:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        phone:
          type:
            - string
            - "null"
        email_usable:
          type: boolean
          description: False means this contact must not be used for email delivery.
        conflict_code:
          type:
            - string
            - "null"
          description: A non-null conflict blocks automatic email use.
    ContactSearchResponse:
      type: object
      additionalProperties: false
      required: [total, showing, items]
      properties:
        total:
          type: integer
          minimum: 0
        showing:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContactItem"
    ContactsStatusResponse:
      type: object
      additionalProperties: false
      required:
        - latest_sync_id
        - latest_sync_status
        - last_success_at
        - rows_seen
        - valid_rows
        - inserted
        - updated
        - deleted
        - unchanged
        - invalid
        - conflicts
      properties:
        latest_sync_id:
          type:
            - string
            - "null"
        latest_sync_status:
          type:
            - string
            - "null"
        last_success_at:
          type:
            - string
            - "null"
        rows_seen:
          type: integer
          minimum: 0
        valid_rows:
          type: integer
          minimum: 0
        inserted:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        deleted:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0
        invalid:
          type: integer
          minimum: 0
        conflicts:
          type: integer
          minimum: 0
    ContactErrorResponse:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    EmailSendRequest:
      type: object
      additionalProperties: false
      required:
        - file_id
        - to
        - subject
        - body
        - confirmed
        - idempotency_key
      properties:
        file_id:
          type: string
          minLength: 1
          description: Exact Drive file ID selected from a read-only search result.
        to:
          type: string
          minLength: 3
          description: Exactly one user-confirmed recipient email address.
        subject:
          type: string
          minLength: 1
          maxLength: 998
          description: User-confirmed one-line email subject.
        body:
          type: string
          description: User-confirmed plain-text email body.
        confirmed:
          type: boolean
          enum:
            - true
          description: Must be true only after explicit final user confirmation.
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{8,128}$"
          description: >-
            New low-collision key for a new approval. Reuse the same key only
            for a transport retry of that exact unchanged approval.
    EmailSendResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - message_id
        - file_id
        - file_name
        - recipient
        - idempotent_replay
      properties:
        status:
          type: string
          enum:
            - sent
        message_id:
          type: string
          minLength: 1
          description: Gmail message ID proving Gmail accepted the message.
        file_id:
          type: string
        file_name:
          type: string
        recipient:
          type: string
        idempotent_replay:
          type: boolean
          description: True when an existing successful result was returned without resending.
    TextEmailPreviewRequest:
      type: object
      additionalProperties: false
      required: [to, cc, subject, body]
      properties:
        to:
          type: string
          minLength: 3
          description: Exactly one proposed primary recipient email address.
        cc:
          type: array
          maxItems: 5
          description: Zero to five proposed CC addresses.
          items:
            type: string
            minLength: 3
        subject:
          type: string
          minLength: 1
          maxLength: 998
          description: Proposed one-line email subject.
        body:
          type: string
          description: Proposed plain-text body. No attachment or Drive link is added.
    TextEmailSendRequest:
      type: object
      additionalProperties: false
      required:
        - preview_id
        - to
        - cc
        - subject
        - body
        - confirmed
        - idempotency_key
      properties:
        preview_id:
          type: string
          minLength: 1
          description: >-
            Use exactly the preview_id returned by the immediately preceding
            successful previewTextEmail call for the same unchanged payload.
            Never invent or substitute it.
        to:
          type: string
          minLength: 3
        cc:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 3
        subject:
          type: string
          minLength: 1
          maxLength: 998
        body:
          type: string
        confirmed:
          type: boolean
          enum: [true]
          description: True only after explicit confirmation of the unchanged preview.
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{8,128}$"
          description: New low-collision key for this newly approved send.
    TextEmailPreviewResponse:
      type: object
      additionalProperties: false
      required:
        - preview_id
        - expires_at
        - recipient
        - cc
        - subject
        - body
        - attachment_count
        - drive_link_count
      properties:
        preview_id:
          type: string
        expires_at:
          type: string
        recipient:
          type: string
        cc:
          type: array
          items:
            type: string
        subject:
          type: string
        body:
          type: string
        attachment_count:
          type: integer
          const: 0
        drive_link_count:
          type: integer
          const: 0
    TextEmailSendResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - message_id
        - recipient
        - cc
        - attachment_count
        - drive_link_count
        - idempotent_replay
      properties:
        status:
          type: string
          enum: [sent]
        message_id:
          type: string
          minLength: 1
        recipient:
          type: string
        cc:
          type: array
          items:
            type: string
        attachment_count:
          type: integer
          const: 0
        drive_link_count:
          type: integer
          const: 0
        idempotent_replay:
          type: boolean
    EnhancedEmailPreviewRequest:
      type: object
      additionalProperties: false
      required: [file_ids, to, cc, subject, body, mode]
      properties:
        file_ids:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          description: Ordered, duplicate-free exact Drive file IDs from search results.
          items:
            type: string
            minLength: 1
        to:
          type: string
          minLength: 3
          description: Exactly one user-confirmed primary recipient.
        cc:
          type: array
          maxItems: 5
          description: Zero to five CC addresses; duplicates and To matches are normalized away.
          items:
            type: string
            minLength: 3
        subject:
          type: string
          minLength: 1
          maxLength: 998
          description: Proposed one-line email subject.
        body:
          type: string
          description: Proposed plain-text body; file links are appended in link mode.
        mode:
          type: string
          enum: [auto, attachment, link]
          description: Requested delivery mode. Forced attachment never silently falls back to link.
    EnhancedEmailSendRequest:
      type: object
      additionalProperties: false
      required:
        - preview_id
        - file_ids
        - to
        - cc
        - subject
        - body
        - mode
        - confirmed
        - idempotency_key
      properties:
        preview_id:
          type: string
          minLength: 1
          description: >-
            Use exactly the preview_id returned by the immediately preceding
            successful previewEmailWithFiles call for the same payload. Never
            invent or substitute it.
        file_ids:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            minLength: 1
        to:
          type: string
          minLength: 3
        cc:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 3
        subject:
          type: string
          minLength: 1
          maxLength: 998
        body:
          type: string
        mode:
          type: string
          enum: [auto, attachment, link]
        confirmed:
          type: boolean
          enum: [true]
          description: True only after explicit confirmation of the unchanged preview.
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{8,128}$"
          description: New low-collision key for this newly approved send.
    EnhancedEmailFile:
      type: object
      additionalProperties: false
      required: [file_id, name, mime_type, size_bytes]
      properties:
        file_id:
          type: string
        name:
          type: string
        mime_type:
          type:
            - string
            - "null"
        size_bytes:
          type:
            - integer
            - "null"
        delivery:
          type:
            - string
            - "null"
          enum: [attachment, link, null]
    EnhancedSharingChange:
      type: object
      additionalProperties: false
      required: [file_id, action, permission_type, role, allow_file_discovery]
      properties:
        file_id:
          type: string
        action:
          type: string
          enum: [existing, create_anyone_reader, created]
        permission_type:
          type: string
          const: anyone
        role:
          type: string
          const: reader
        allow_file_discovery:
          type: boolean
          const: false
    EnhancedEmailPreviewResponse:
      type: object
      additionalProperties: false
      required:
        - preview_id
        - expires_at
        - requested_mode
        - delivery_mode
        - sharing_mode
        - file_count
        - total_size_bytes
        - files
        - recipient
        - cc
        - sharing_changes
      properties:
        preview_id:
          type: string
        expires_at:
          type: string
        requested_mode:
          type: string
          enum: [auto, attachment, link]
        delivery_mode:
          type: string
          enum: [attachment, link]
        sharing_mode:
          type: string
          enum: [none, anyone_with_link_reader]
          description: >-
            Link mode means anyone who receives the webViewLink can view the
            file without being a named Drive permission recipient.
        file_count:
          type: integer
          minimum: 1
          maximum: 5
        total_size_bytes:
          type:
            - integer
            - "null"
        files:
          type: array
          items:
            $ref: "#/components/schemas/EnhancedEmailFile"
        recipient:
          type: string
        cc:
          type: array
          items:
            type: string
        sharing_changes:
          type: array
          items:
            $ref: "#/components/schemas/EnhancedSharingChange"
    EnhancedEmailSendResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - delivery_mode
        - sharing_mode
        - file_count
        - files
        - recipient
        - cc
        - message_id
        - sharing_changes
        - idempotent_replay
      properties:
        status:
          type: string
          enum: [sent]
        delivery_mode:
          type: string
          enum: [attachment, link]
        sharing_mode:
          type: string
          enum: [none, anyone_with_link_reader]
        file_count:
          type: integer
          minimum: 1
          maximum: 5
        files:
          type: array
          items:
            $ref: "#/components/schemas/EnhancedEmailFile"
        recipient:
          type: string
        cc:
          type: array
          items:
            type: string
        message_id:
          type: string
          minLength: 1
        sharing_changes:
          type: array
          items:
            $ref: "#/components/schemas/EnhancedSharingChange"
        idempotent_replay:
          type: boolean
    EmailErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          $ref: "#/components/schemas/EmailErrorDetail"
    EmailErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorItem"
    ValidationErrorItem:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
